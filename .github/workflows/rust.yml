name: rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (latest stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (incl. golden vectors + simulated mesh)
        run: cargo test --workspace

  android-lib:
    name: Rust core for Android (cargo-ndk)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (latest stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;28.2.13676358

      - name: Build libcypher.so (all ABIs)
        run: |
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android; do
            cargo ndk -t $target -o android/app/src/main/jniLibs build --release -p cypher-android
          done

      - name: Verify JNI symbols match the Kotlin declarations
        run: ./tools/verify-jni-symbols.sh

      - name: Verify no host paths leaked into the binaries
        run: |
          # The checksum manifest only matches when the committed libs equal
          # this exact build; the host-path scan is the hard gate either way.
          ./tools/verify-native-checksums.sh || true

      - name: Upload native libs
        uses: actions/upload-artifact@v4
        with:
          name: libcypher-android
          path: android/app/src/main/jniLibs/**/libcypher.so
