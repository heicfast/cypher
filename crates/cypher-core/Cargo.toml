[package]
name = "cypher-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cypher mesh core: binary protocol, Noise crypto, mesh engine, store-and-forward features (Rust port of bitchat)"

[dependencies]
# AEAD + DH + signatures (byte-compatible with CryptoKit behaviour)
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hmac = "0.12"
subtle = "2"

# RNG: dalek 2.x crates speak rand_core 0.6
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }

# zlib (Apple COMPRESSION_ZLIB compatible stream)
flate2 = "1"

# zeroization for key material
zeroize = { version = "1", features = ["zeroize_derive"] }

# persistence (stores: courier, groups, board, sync archive, outbox)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# misc
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
hex-literal = "0.4"

[lib]
name = "cypher_core"
path = "src/lib.rs"
