name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # NOTE: the platform ships as the minor-versioned package
          # (platforms;android-37.0) — a bare `platforms;android-37`
          # does not exist in the repository index.
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358

      - name: Verify checked-in native libraries
        run: ./tools/verify-native-checksums.sh

      - name: Verify JNI symbols match the Kotlin declarations
        run: ./tools/verify-jni-symbols.sh

      - name: Build APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cypher-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
